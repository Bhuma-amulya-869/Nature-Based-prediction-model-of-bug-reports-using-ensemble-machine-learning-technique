<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Remote User</title>
<link href="https://fonts.googleapis.com/css?family=Russo+One" rel="stylesheet">
<style>
      body{background: url("{% static 'bg.jpg' %}");
	background-size:cover;
	font-family: 'Russo One', sans-serif;
	background-color: #000000;
    }
    h1{
    color: #facc15;
    }
.topnav {
  background-color: #1e293b;
  border-radius: 8px;
}

.topnav a {
  color: #ffffff;
  font-weight: bold;
}

.topnav a:hover {
  background-color: #6366f1;
  color: white;
}

.topnav a.active {
  background-color: #8e4fd1;
  color: white;
}
.style1 {
	color: #FF0000;
	font-weight: bold;
}
</style>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head>
<body>

<h1 align="center" class="style1">Nature Based Prediction Model of Bug Reports Based on Ensemble Machine Learning Model</h1>

<div style="
    display:flex;
    justify-content:center;
    align-items:center;
    background-color:#2c2c54;
    padding:12px 0;
    gap:30px;
">
    <a href="{% url 'Predict_Bug_Report_Type' %}" style="
        color:white;
        text-decoration:none;
        font-size:16px;
        font-weight:bold;
        padding:10px 18px;
        border-radius:6px;
    ">Predict Bug Report Type</a>

    <a href="{% url 'ViewYourProfile' %}" style="
        color:white;
        text-decoration:none;
        font-size:16px;
        font-weight:bold;
        padding:10px 18px;
        border-radius:6px;
    ">View Your Profile</a>

    <a href="{% url 'login' %}" style="
        color:white;
        text-decoration:none;
        font-size:16px;
        font-weight:bold;
        padding:10px 18px;
        border-radius:6px;
        background-color:#ff4757;
    ">Logout</a>
</div>


<div class="mainholder">
{% block userblock %}
{% endblock %}
</div>
</body>
</html>
