{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <title>Service Provider Login</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Fredoka+One|Righteous" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #7f1d1d, #991b1b);
            font-family: 'Righteous', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: #ffffff;
            width: 420px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0px 20px 45px rgba(0,0,0,0.5);
        }

        .login-title {
            font-family: 'Fredoka One', cursive;
            text-align: center;
            font-size: 22px;
            margin-bottom: 5px;
            color: #1f2937;
        }

        .subtitle {
            text-align: center;
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 25px;
        }

        .login-image {
            text-align: center;
            margin-bottom: 20px;
        }

        .login-image img {
            width: 90px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #dc2626;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #dc2626;
            border: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #b91c1c;
        }

        .divider {
            margin: 25px 0;
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
        }

        .user-login-btn {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }

        .user-login-btn a {
            color: #ffffff;
            text-decoration: none;
            display: block;
        }

        .user-login-btn:hover {
            background: #1e40af;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-image">
        <img src="{% static 'login.jpg' %}" alt="Login">
    </div>

    <div class="login-title">
        Service Provider Login
    </div>

    <div class="subtitle">
        Nature Based Prediction Model of Bug Reports
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <input type="text" name="username" placeholder="Enter Username" required>
        </div>

        <div class="form-group">
            <input type="password" name="password" placeholder="Enter Password" required>
        </div>

        <button type="submit" name="submit1" class="login-btn">
            Login
        </button>

    </form>

    <div class="divider">
        OR
    </div>

    <button class="user-login-btn">
        <a href="{% url 'login' %}">User Login</a>
    </button>

</div>

</body>
</html>
